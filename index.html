<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานผลการปฏิบัติงาน รปภ.</title>
    <!-- นำเข้าฟอนต์สารบรรณ (Sarabun) -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- นำเข้าไลบรารี SheetJS สำหรับ Export Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #FAFAFA;
            color: #333333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #FFFFFF;
            padding: 30px;
            border: 1px solid #E0E0E0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        h2 {
            text-align: center;
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .header-action {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .tabs {
            display: flex;
            gap: 10px;
        }
        .tab-btn {
            background-color: #E0E0E0;
            color: #333;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Sarabun', sans-serif;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px 4px 0 0;
        }
        .tab-btn.active {
            background-color: #333;
            color: #FFF;
        }
        .export-buttons {
            display: flex;
            gap: 10px;
        }
        .btn-export {
            background-color: #2e7d32;
            color: #FFF;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 4px;
            font-family: 'Sarabun', sans-serif;
            font-size: 15px;
        }
        .btn-export.pdf {
            background-color: #c62828;
        }
        .btn-export:hover {
            opacity: 0.9;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #BDBDBD;
            padding: 12px;
            text-align: left;
            font-size: 16px;
            vertical-align: middle;
        }
        th {
            background-color: #EEEEEE;
            font-weight: 600;
            text-align: center;
        }
        .thumb-img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 1px solid #BDBDBD;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 4px;
        }
        #imageModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            text-align: center;
            overflow-y: auto;
        }
        .modal-content {
            margin: 50px auto;
            background: #FFF;
            padding: 20px;
            width: 80%;
            max-width: 800px;
            border-radius: 5px;
        }
        .close-btn {
            float: right;
            cursor: pointer;
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
        .modal-img {
            max-width: 100%;
            height: auto;
            border: 1px solid #CCC;
            margin-top: 10px;
        }

        /* 🖨️ ตั้งค่าสำหรับการพิมพ์ออก PDF (ให้รูปภาพแสดงผลด้วย) */
        @media print {
            body { 
                background-color: #FFF; 
                padding: 0; 
            }
            .container { 
                border: none; 
                box-shadow: none; 
                padding: 0; 
                width: 100%;
                max-width: none;
            }
            .tabs, .export-buttons, .btn-view {
                display: none !important; 
            }
            .thumb-img {
                width: 50px !important;
                height: 50px !important;
                border: 1px solid #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            table {
                page-break-inside: auto;
            }
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ระบบรายงานผลการปฏิบัติงาน รปภ.</h2>
    
    <div class="header-action">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('shift', event)">1. รายงานเข้าเวร</button>
            <button class="tab-btn" onclick="switchTab('patrol', event)">2. รายงานเหตุการณ์</button>
        </div>
        <div class="export-buttons">
            <button class="btn-export" onclick="exportToExcel()">📊 ดาวน์โหลด Excel</button>
            <button class="btn-export pdf" onclick="exportToPDF()">🖨️ พิมพ์ / บันทึก PDF</button>
        </div>
    </div>

    <!-- แท็บที่ 1: รายงานเข้าเวร -->
    <div id="shiftTab" class="tab-content active">
        <h3>รายการรายงานเข้าเวรประจำวัน</h3>
        <table id="shiftTable">
            <thead>
                <tr>
                    <th width="15%">วันที่รายงาน</th>
                    <th width="15%">ผลัดที่ปฏิบัติ</th>
                    <th width="25%">ชื่อ รปภ. 1</th>
                    <th width="25%">ชื่อ รปภ. 2</th>
                    <th width="20%">รูปภาพประกอบ</th>
                </tr>
            </thead>
            <tbody id="shiftTableBody">
                <tr><td colspan="5" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- แท็บที่ 2: รายงานเหตุการณ์ -->
    <div id="patrolTab" class="tab-content">
        <h3>รายการรายงานเหตุการณ์ประจำวัน</h3>
        <table id="patrolTable">
            <thead>
                <tr>
                    <th width="20%">วันที่ / เวลา</th>
                    <th width="25%">ชื่อเจ้าหน้าที่</th>
                    <th width="35%">ข้อความรายงาน</th>
                    <th width="20%">รูปภาพประกอบ</th>
                </tr>
            </thead>
            <tbody id="patrolTableBody">
                <tr><td colspan="4" style="text-align:center;">กำลังโหลดข้อมูล...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- หน้าต่าง Modal สำหรับขยายดูรูปภาพ -->
<div id="imageModal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3>รูปภาพขนาดเต็ม</h3>
        <img id="modalImage" class="modal-img" src="" alt="Full size">
    </div>
</div>

<!-- เรียกใช้ Firebase Web SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    // 💡 นำเข้าคำสั่ง orderBy เพิ่มเติม
    import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB8j7NqHISDCl7srCXc3VJGWlJRHFNzD5E",
        authDomain: "bangkaeo-pet-reg.firebaseapp.com",
        projectId: "bangkaeo-pet-reg",
        storageBucket: "bangkaeo-pet-reg.firebasestorage.app",
        messagingSenderId: "996360110983",
        appId: "1:996360110983:web:eba0efc7e6a6c087d90922"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentActiveTab = 'shift';

    window.switchTab = function(tabName, event) {
        currentActiveTab = tabName;
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        if (tabName === 'shift') {
            document.getElementById('shiftTab').classList.add('active');
            loadShiftData();
        } else {
            document.getElementById('patrolTab').classList.add('active');
            loadPatrolData();
        }
        event.currentTarget.classList.add('active');
    }

    async function fetchImagesHtml(collectionName, docId) {
        try {
            const imagesRef = collection(db, collectionName, docId, "images");
            const imageSnapshot = await getDocs(imagesRef);
            if (imageSnapshot.empty) return '-';

            let html = '';
            imageSnapshot.forEach((imgDoc) => {
                const imgData = imgDoc.data();
                html += `<img src="${imgData.image_data}" class="thumb-img" onclick="openModal('${imgData.image_data}')" title="คลิกเพื่อขยายรูป">`;
            });
            return html;
        } catch (error) {
            return 'โหลดรูปไม่สำเร็จ';
        }
    }

    async function loadShiftData() {
        const tableBody = document.getElementById('shiftTableBody');
        try {
            // 💡 สั่งให้เรียงข้อมูลตาม timestamp แบบ desc (ใหม่ไปเก่า)
            const q = query(collection(db, "shift_reports"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            tableBody.innerHTML = '';

            if (querySnapshot.empty) {
                tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;">ยังไม่มีข้อมูลรายงานเข้าเวร</td></tr>';
                return;
            }

            for (const docSnap of querySnapshot.docs) {
                const data = docSnap.data();
                const tr = document.createElement('tr');
                const guard1 = data.guards && data.guards[0] ? data.guards[0] : '-';
                const guard2 = data.guards && data.guards[1] ? data.guards[1] : '-';
                const imagesHtml = await fetchImagesHtml('shift_reports', docSnap.id);

                tr.innerHTML = `
                    <td style="text-align:center;">${data.date || '-'}</td>
                    <td style="text-align:center;">${data.shift || '-'}</td>
                    <td>${guard1}</td>
                    <td>${guard2}</td>
                    <td style="text-align:center;">${imagesHtml}</td>
                `;
                tableBody.appendChild(tr);
            }
        } catch (error) {
            tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:red;">เกิดข้อผิดพลาดในการดึงข้อมูล (ตรวจสอบสิทธิ์ Index ใน Firebase)</td></tr>';
            console.error("Error loading shift data:", error);
        }
    }

    async function loadPatrolData() {
        const tableBody = document.getElementById('patrolTableBody');
        try {
            // 💡 สั่งให้เรียงข้อมูลตาม timestamp แบบ desc (ใหม่ไปเก่า)
            const q = query(collection(db, "patrol_reports"), orderBy("timestamp", "desc"));
            const querySnapshot = await getDocs(q);
            tableBody.innerHTML = '';

            if (querySnapshot.empty) {
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">ยังไม่มีข้อมูลรายงานเหตุการณ์</td></tr>';
                return;
            }

            for (const docSnap of querySnapshot.docs) {
                const data = docSnap.data();
                const tr = document.createElement('tr');
                const imagesHtml = await fetchImagesHtml('patrol_reports', docSnap.id);

                tr.innerHTML = `
                    <td style="text-align:center;">${data.time || '-'}</td>
                    <td>${data.guardName || '-'}</td>
                    <td><pre style="font-family:'Sarabun'; margin:0; white-space:pre-wrap;">${data.raw_text || '-'}</pre></td>
                    <td style="text-align:center;">${imagesHtml}</td>
                `;
                tableBody.appendChild(tr);
            }
        } catch (error) {
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:red;">เกิดข้อผิดพลาดในการดึงข้อมูล (ตรวจสอบสิทธิ์ Index ใน Firebase)</td></tr>';
            console.error("Error loading patrol data:", error);
        }
    }

    window.openModal = function(imgSrc) {
        document.getElementById('modalImage').src = imgSrc;
        document.getElementById('imageModal').style.display = 'block';
    }

    window.exportToExcel = function() {
        let tableId = currentActiveTab === 'shift' ? 'shiftTable' : 'patrolTable';
        let fileName = currentActiveTab === 'shift' ? 'รายงานเข้าเวร รปภ.xlsx' : 'รายงานเหตุการณ์ รปภ.xlsx';
        
        let table = document.getElementById(tableId);
        let wb = XLSX.utils.table_to_book(table, { raw: true });
        XLSX.writeFile(wb, fileName);
    }

    window.exportToPDF = function() {
        window.print();
    }

    loadShiftData();
</script>

<script>
    function closeModal() {
        document.getElementById('imageModal').style.display = 'none';
    }
</script>

</body>
</html>
